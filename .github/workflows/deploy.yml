
name: Publicar Nealítica Consultora en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v5

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Compilar página
        run: bun run build

      - name: Preparar archivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
